name: ProofPatch checkout regression

on:
  workflow_call:
    inputs:
      gemini_model:
        description: Gemini model used to generate candidate checkout tests
        type: string
        default: gemini-3.5-flash
    secrets:
      GEMINI_API_KEY:
        description: Gemini API key owned by the caller
        required: false

permissions:
  contents: read

jobs:
  compare:
    name: Compare checkout commits
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR head and Git history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Check out the ProofPatch version defining this workflow
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: proofpatch-tool
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the API dependencies
        working-directory: proofpatch-tool/ProofPatch
        run: python -m pip install -r requirements.txt

      - name: Build the isolated pytest runner
        working-directory: proofpatch-tool/ProofPatch
        run: docker build -t proofpatch-runner:local .

      - name: Call the ProofPatch API
        working-directory: proofpatch-tool/ProofPatch
        env:
          PROOFPATCH_TARGET: ${{ github.workspace }}/target
          PROOFPATCH_OUTPUT: ${{ github.workspace }}/proofpatch-results
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
        run: python -m scripts.check_pull_request

      - name: Save candidate tests and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofpatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/proofpatch-results/
          retention-days: 14
          if-no-files-found: warn
